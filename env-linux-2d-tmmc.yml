# Native Linux x86-64 executable on the v3.0.30 release base.
name: raspa-2d-tmmc
channels:
  - conda-forge
  - nodefaults
dependencies:
  - cmake=4.3.*
  - ninja=1.12
  - clang=20.1.6
  - clangxx=20.1.6
  - clang-tools=20.1.6
  - llvm-tools=20.1.6
  - llvm-openmp=20.1.6
  - lld=20.1.6
  - gcc=15.1.0
  - libstdcxx-devel_linux-64=15.1.0
  - sysroot_linux-64=2.28
  - blas=*=openblas
  - blas-devel=*=*openblas
  - openblas=0.3.29
  - zlib=1.3
  - opencl-headers=2024.10.24
  - ocl-icd=2.3.3
  - git
  - python=3.12

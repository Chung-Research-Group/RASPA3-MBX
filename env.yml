# Upstream environment for the release base. For the Linux 2D-TMMC executable,
# use env-linux-2d-tmmc.yml and the instructions in INSTALLATION.md.
name: raspa3
prefix: ./env
channels:
- conda-forge
- pkgs/main
dependencies:
- clang>=19.1.7
- clangxx>=19.1.7
- clang-tools>=19.1.7
- llvm-tools>=19.1.7
- libcxx>=19.1.7
- libcxx-devel>=19.1.7
- llvm-openmp>=19.1.7
- lld>=19.1.7
- cmake>=4.3.0
- ninja>=1.11.1
- python
- lapack
- blas
- zlib
- gtest
# - ocl-icd

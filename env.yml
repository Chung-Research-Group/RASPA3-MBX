# Reproducible Linux x86-64 build environment for RASPA3-MBX and public MBX.
#
# Create it with:
#   conda env create -f env.yml
#   conda activate raspa3-mbx
#
# Compiler and CMake versions are pinned because C++ standard-library modules
# and CMake's experimental `import std` gate are version-sensitive. Runtime
# users must keep this environment's lib directory on LD_LIBRARY_PATH; see the
# server-module instructions in README.md.
name: raspa3-mbx

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Validated C++26 module toolchain.
  - cmake=4.0.3
  - ninja=1.12
  - clang=20.1.6
  - clangxx=20.1.6
  - clang-tools=20.1.6
  - llvm-tools=20.1.6
  - lld=20.1.6
  - llvm-openmp=20.1.6

  # Clang uses this GCC 15 libstdc++ installation, including its std module.
  - gcc=15.1.0
  - libstdcxx-devel_linux-64=15.1.0
  - sysroot_linux-64=2.28

  # RASPA3-MBX numerical and I/O dependencies.
  - blas=*=openblas
  - blas-devel=*=*openblas
  - openblas=0.3.29
  - fftw=3.3.10
  - hdf5=1.14.6=nompi_*
  - zlib=1.3
  - gtest=1.17
  - opencl-headers=2024.10.24
  - ocl-icd=2.3.3

  # Public MBX autotools build and repository utilities.
  - autoconf
  - automake
  - libtool
  - make
  - pkg-config
  - git
  - python=3.12

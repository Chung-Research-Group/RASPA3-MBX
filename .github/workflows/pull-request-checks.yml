name: test-raspa3
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  cpp-formatting:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout-repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set-up-formatting-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-formatting-tools
        run: python -m pip install clang-format==20.1.6

      - name: check-changed-cpp-lines
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: python tests/check_cpp_format.py --base "$REVIEW_BASE"

  python-formatting:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout-repository
        uses: actions/checkout@v4

      - name: set-up-python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: install-black
        run: |
          python -m pip install --upgrade pip
          pip install black==26.10.1

      - name: run-black
        shell: bash
        run: |
          # Check formatting of Python files in raspa/ directory
          black -l 120 --check raspa/

  test-cpp:
    uses: ./.github/workflows/mbx-validation.yml
